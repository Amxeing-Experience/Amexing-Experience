# Nginx Configuration for Image Format Negotiation
# Alternative to CloudFront for serving optimized images
#
# Created by Denisse Maldonado
# Version 1.0.0

# Map Accept header to preferred image format
map $http_accept $webp_suffix {
    default "";
    "~*webp" ".webp";
}

map $http_accept $avif_suffix {
    default "";
    "~*avif" ".avif";
}

# Determine the best format to serve
map $http_accept $preferred_format {
    default "jpeg";
    "~*avif" "avif";
    "~*webp" "webp";
}

# S3 bucket configuration (update with your bucket details)
upstream s3_backend {
    server amexing-bucket.s3.us-east-2.amazonaws.com:443;
    keepalive 10;
}

server {
    listen 80;
    listen [::]:80;
    server_name images.amexing.com;  # Your domain
    
    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name images.amexing.com;
    
    # SSL configuration (update with your certificates)
    ssl_certificate /etc/nginx/ssl/amexing.crt;
    ssl_certificate_key /etc/nginx/ssl/amexing.key;
    
    # Performance optimizations
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss text/javascript image/svg+xml;
    
    # Cache settings
    proxy_cache_path /var/cache/nginx/images levels=1:2 keys_zone=images_cache:100m max_size=10g inactive=30d use_temp_path=off;
    
    # Image serving with format negotiation
    location ~ ^/vehicles/(.+)\.(jpg|jpeg|png)$ {
        set $vehicle_path $1;
        set $original_ext $2;
        
        # Try to serve optimized format based on Accept header
        # Order: AVIF -> WebP -> Original
        
        # First, try AVIF if supported
        if ($http_accept ~* "avif") {
            rewrite ^/vehicles/(.+)\.(jpg|jpeg|png)$ /optimized/avif/vehicles/$1.avif last;
        }
        
        # Then, try WebP if supported
        if ($http_accept ~* "webp") {
            rewrite ^/vehicles/(.+)\.(jpg|jpeg|png)$ /optimized/webp/vehicles/$1.webp last;
        }
        
        # Fallback to optimized JPEG
        rewrite ^/vehicles/(.+)\.(jpg|jpeg|png)$ /optimized/jpeg/vehicles/$1.jpg last;
    }
    
    # Serve optimized images from S3
    location ~ ^/optimized/(avif|webp|jpeg)/(.+)$ {
        set $format $1;
        set $image_path $2;
        
        # Enable caching
        proxy_cache images_cache;
        proxy_cache_valid 200 302 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_key "$scheme$request_method$host$request_uri$http_accept";
        
        # Set headers
        add_header X-Cache-Status $upstream_cache_status;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary Accept;
        add_header X-Optimized-Format $format;
        
        # CORS headers (if needed)
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
        
        # Content type based on format
        set $content_type "image/jpeg";
        if ($format = "avif") {
            set $content_type "image/avif";
        }
        if ($format = "webp") {
            set $content_type "image/webp";
        }
        
        # Proxy to S3
        proxy_pass https://s3_backend/prod/optimized/$format/$image_path;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host amexing-bucket.s3.us-east-2.amazonaws.com;
        proxy_set_header Content-Type $content_type;
        
        # Hide S3 headers
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-meta-server-side-encryption;
        proxy_hide_header x-amz-server-side-encryption;
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Set-Cookie;
        
        # Handle 404s - try fallback formats
        proxy_intercept_errors on;
        error_page 404 = @fallback_format;
    }
    
    # Fallback when optimized format doesn't exist
    location @fallback_format {
        # Try next format in chain
        try_files /optimized/webp/$image_path /optimized/jpeg/$image_path /vehicles/$image_path =404;
    }
    
    # Direct S3 proxy for original images (fallback)
    location ~ ^/vehicles/(.+)$ {
        set $s3_path $1;
        
        # Cache original images too
        proxy_cache images_cache;
        proxy_cache_valid 200 302 7d;
        proxy_cache_valid 404 1m;
        
        add_header Cache-Control "public, max-age=604800";
        add_header X-Cache-Status $upstream_cache_status;
        
        proxy_pass https://s3_backend/prod/vehicles/$s3_path;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host amexing-bucket.s3.us-east-2.amazonaws.com;
        
        # Hide S3 headers
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Set-Cookie;
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Cache purge endpoint (optional, requires ngx_cache_purge module)
    location ~ /purge(/.*) {
        allow 127.0.0.1;
        deny all;
        proxy_cache_purge images_cache "$scheme$request_method$host$1$is_args$args";
    }
    
    # Status page (optional)
    location /nginx_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Rate limiting (optional)
    limit_req_zone $binary_remote_addr zone=images:10m rate=100r/s;
    limit_req zone=images burst=20 nodelay;
}

# Alternative: Simple location-based format serving
# Use this if you prefer explicit URLs for each format
server {
    listen 8080;
    server_name images-simple.amexing.com;
    
    # Serve AVIF images
    location ~ \.avif$ {
        root /var/www/optimized/avif;
        add_header Content-Type image/avif;
        add_header Cache-Control "public, max-age=31536000";
        try_files $uri =404;
    }
    
    # Serve WebP images
    location ~ \.webp$ {
        root /var/www/optimized/webp;
        add_header Content-Type image/webp;
        add_header Cache-Control "public, max-age=31536000";
        try_files $uri =404;
    }
    
    # Serve JPEG images
    location ~ \.(jpg|jpeg)$ {
        root /var/www/optimized/jpeg;
        add_header Content-Type image/jpeg;
        add_header Cache-Control "public, max-age=31536000";
        try_files $uri =404;
    }
}