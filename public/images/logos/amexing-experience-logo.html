<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #2e2e2d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        .logo-container {
            text-align: center;
            color: white;
        }
        .logo-main {
            font-size: 48px;
            font-weight: 300;
            letter-spacing: 8px;
            margin-bottom: -5px;
        }
        .logo-sub {
            font-size: 12px;
            font-weight: 300;
            letter-spacing: 7px;
            opacity: 0.9;
        }
        .logo-trademark {
            font-size: 10px;
            vertical-align: super;
            margin-left: 2px;
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <div class="logo-main">AMEXING</div>
        <div class="logo-sub">EXPERIENCE<span class="logo-trademark">®</span></div>
    </div>
</body>
</html>
